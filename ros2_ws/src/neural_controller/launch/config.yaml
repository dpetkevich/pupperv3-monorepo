controller_manager:
  ros__parameters:
    # Run slightly above nominal 500Hz in order to get exactly 50hz for neural controller
    # Should develop a better way to handle this in the future
    update_rate: 520

    neural_controller:
      type: neural_controller/NeuralController

    neural_controller_three_legged:
      type: neural_controller/NeuralController

    # Forward command controllers for animation
    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    forward_kp_controller:
      type: forward_command_controller/ForwardCommandController

    forward_kd_controller:
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

imu_sensor_broadcaster:
  ros__parameters:
    update_rate: 260
    frame_id: base_link
    sensor_name: imu_sensor

neural_controller:
  ros__parameters:
    repeat_action: 10

    gain_multiplier: 1.0
    estop_kd: 0.1

    joint_names:
      [
        "leg_front_r_1",
        "leg_front_r_2",
        "leg_front_r_3",
        "leg_front_l_1",
        "leg_front_l_2",
        "leg_front_l_3",
        "leg_back_r_1",
        "leg_back_r_2",
        "leg_back_r_3",
        "leg_back_l_1",
        "leg_back_l_2",
        "leg_back_l_3",
      ]

    default_joint_pos:
      [0.26, 0.0, -0.52, -0.26, 0.0, 0.52, 0.26, 0.0, -0.52, -0.26, 0.0, 0.52]

    init_kps: [7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5]
    init_kds:
      [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]

    init_duration: 1.0
    fade_in_duration: 1.0

    action_types:
      [
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
      ]

    max_body_angle: 1.5

    model_path: "$(find-pkg-share neural_controller)/launch/policy_latest.json"

neural_controller_three_legged:
  ros__parameters:
    repeat_action: 10

    gain_multiplier: 1.0
    estop_kd: 0.3

    joint_names:
      [
        "leg_front_r_1",
        "leg_front_r_2",
        "leg_front_r_3",
        "leg_front_l_1",
        "leg_front_l_2",
        "leg_front_l_3",
        "leg_back_r_1",
        "leg_back_r_2",
        "leg_back_r_3",
        "leg_back_l_1",
        "leg_back_l_2",
        "leg_back_l_3",
      ]

    default_joint_pos:
      [0.26, 0.0, -0.52, -0.26, 0.0, 0.52, 0.26, 0.0, -0.52, -0.26, 0.0, 0.52]

    init_kps: [7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5]
    init_kds:
      [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]

    init_duration: 2.0
    fade_in_duration: 2.0

    action_types:
      [
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
      ]

    max_body_angle: 1.5

    model_path: "$(find-pkg-share neural_controller)/launch/policy_rich-donkey-233_max_reward_19.16.json"

teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
      y: 0
    scale_linear:
      x: 0.75
      y: 0.5

    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 2.0

    require_enable_button: false

# joy_node:
#   ros__parameters:
#     dev: "/dev/input/js0"
#     autorepeat_rate: 50.0
#     coalesce_interval_ms: 20

joy_linux_node:
  ros__parameters:
    dev: "/dev/input/js0"
    autorepeat_rate: 50.0
    coalesce_interval: 0.02

joint_state_broadcaster:
  ros__parameters:
    update_rate: 260
    use_local_topics: false

cmd_vel_mux:
  ros__parameters:
    deadband: 0.05
    timeout_ms: 500
    # Priority order (first = highest). Any message on a non-teleop input, even zeros, counts as active for timeout_ms.
    inputs: ["/teleop_cmd_vel", "/reflex_cmd_vel", "/motion_cmd_vel", "/llm_cmd_vel", "/person_following_cmd_vel"]

motion_server:
  ros__parameters:
    cmd_topic: "/motion_cmd_vel"
    higher_priority_sources: ["/teleop_cmd_vel", "/reflex_cmd_vel"]
    auto_activate: true
    activation_settle_s: 2.5
    # Dead-reckoning calibration: run `ros2 run pupper_motion calibrate_k --write <this file>`
    k_vx: 1.0
    k_vy: 1.0
    lag_tau: 0.3
    sigma_frac: 0.35
    # Heading fusion: 0.02 = complementary filter on the fused rotation vector; 0.0 = gyro only
    yaw_alpha: 0.02
    turn_speed_dps: 70.0
    move_speed: 0.45
    vx_floor: 0.35
    vy_floor: 0.4

plan_executor:
  ros__parameters:
    google_api_key_file: "/home/pi/pupperv3-monorepo/ai/llm-ui/agent-starter-python/.env.local"
    equirect_width: 800
    equirect_height: 720
    h_fov_deg: 180.0
    v_fov_deg: 180.0
    camera_height_m: 0.2
    look_settle_s: 0.4
    look_max_age_s: 0.6
    animate_wait_s: 8.0

joy_util_node:
  ros__parameters:
    estop_index: 12
    estop_release_index: 9
    controller_names: ["neural_controller", "neural_controller_three_legged", "forward_kp_controller", "forward_kd_controller", "forward_position_controller"]
    switch_button_indices: [0, 1]

